<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Ugandan Sheikhs</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/theme-ocean.css" />
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-visual">
      <img class="auth-pattern" src="img/pattern-auth.svg" alt="" />
      <div class="auth-brand">
        <span class="logo-mark auth-logo"><img class="logo-blue" src="img/logo-mark-blue.png" alt="" /><img class="logo-green" src="img/logo-mark-green.png" alt="" /></span>
        <div class="auth-brand-name">Ugandan Sheikhs</div>
        <p class="quote">“A fresh password, and your library is right where you left it.”</p>
      </div>
    </div>
    <div class="auth-form-wrap">
      <div class="auth-form">
        <a class="auth-form-brand" href="index.html" style="display:inline-flex;align-items:center;gap:9px;margin-bottom:36px;">
          <span class="logo-mark"><img class="logo-blue" src="img/logo-mark-blue.png" alt="" width="36" height="36" /><img class="logo-green" src="img/logo-mark-green.png" alt="" width="36" height="36" /></span>
          <span style="font-family:var(--font-display);font-weight:600;font-size:18px;">Ugandan Sheikhs</span>
        </a>
        <h1>Set a new password</h1>
        <p>Choose a strong password you haven't used before.</p>
        <form onsubmit="event.preventDefault();toast('Password updated — redirecting…','success');setTimeout(()=>location.href='login.html',700);">
          <div class="field"><label>New password</label><input class="input" type="password" placeholder="••••••••" required /></div>
          <div class="field"><label>Confirm new password</label><input class="input" type="password" placeholder="••••••••" required /></div>
          <button class="btn btn-primary" type="submit" style="width:100%;">Update Password</button>
        </form>
      </div>
    </div>
  </div>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
