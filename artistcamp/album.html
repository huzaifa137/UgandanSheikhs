<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Series — Ugandan Sheikhs</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/theme-ocean.css" />
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="shell-sidebar"></aside>
    <div class="main">
      <header class="topbar" id="shell-topbar"></header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="player" id="shell-player"></div>
  <div class="mini-player" id="shell-mini-player"></div>
  <nav class="mobile-nav" id="shell-mobilenav"></nav>
  <div id="shell-overlays"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
  <script>
    initAppPage("");
    const params = new URLSearchParams(location.search);
    const album = ALBUMS.find(a => a.id === params.get("id")) || ALBUMS[0];
    const artist = ARTISTS.find(a => a.id === album.artistId) || ARTISTS[0];
    const albumTracks = album.tracks;
    const totalSecs = albumTracks.reduce((s,t)=>s+t.duration,0);
    const similarAlbums = ALBUMS.filter(a => a.genre === album.genre && a.id !== album.id).slice(0,6);
    const moreFromArtist = ALBUMS.filter(a => a.artistId === album.artistId && a.id !== album.id).slice(0,6);
    const albumComments = COMMENTS.slice(0,5);

    document.getElementById("content").innerHTML = `
      <div class="entity-hero" style="margin-top:8px;">
        <div class="entity-hero-body" style="margin-top:0;">
          <img class="entity-hero-art" src="${album.art}" alt="${album.title}" />
          <div class="entity-hero-info">
            <div class="kind">${album.type}</div>
            <h1>${album.title}</h1>
            <div class="entity-hero-meta">
              <a href="artist.html?id=${artist.id}" style="color:var(--text-primary);font-weight:600;">${artist.name}</a>
              <span>·</span><span>${album.year}</span><span>·</span><span>${album.genre}</span>
              <span>·</span><span>${albumTracks.length} lectures, ${Math.round(totalSecs/60)} min</span>
            </div>
          </div>
        </div>
        <div class="entity-hero-actions album-actions">
          <button class="btn btn-primary" onclick="toast('Playing ${album.title.replace(/'/g,"")}')">${ICONS.play}<span>Play Series</span></button>
          <button class="btn btn-secondary" onclick="toast('Shuffling album')">${ICONS.shuffle}<span>Shuffle</span></button>
          <button class="btn btn-outline" onclick="toast('Series download started','success')">${ICONS.download}<span>Download Series</span></button>
          <button class="icon-btn btn-icon-only" onclick="toast('Saved to library','success')">${ICONS.heart}</button>
          <button class="icon-btn btn-icon-only" onclick="toast('Link copied to clipboard')">${ICONS.share}</button>
          <button class="icon-btn btn-icon-only" title="More options" aria-label="More options" aria-haspopup="menu" data-menu="series:${album.id}">${ICONS.more}</button>
        </div>
      </div>

      <p class="text-secondary" style="max-width:640px;margin:20px 0;">${album.description}</p>

      <table class="track-table">
        <thead><tr><th>#</th><th>Lecture</th><th>Plays</th><th></th><th>Time</th><th></th></tr></thead>
        <tbody>
          ${albumTracks.map((t,i)=>`
          <tr class="track-row">
            <td class="t-num"><span class="num">${i+1}</span><button class="icon-btn play-ico" style="background:none;width:18px;height:18px;">${ICONS.play}</button></td>
            <td><div class="t-title-cell"><div><div class="t-title">${t.title} ${t.explicit?'<span class="badge badge-explicit">E</span>':''}</div><a class="t-artist" href="artist.html?id=${artist.id}">${artist.name}</a></div></div></td>
            <td class="t-meta">${fmtCount(t.plays)}</td>
            <td>${t.downloadable ? '<span class="badge badge-success">Downloadable</span>' : '<span class="badge badge-neutral">Streaming Only</span>'}</td>
            <td class="t-meta">${fmtDuration(t.duration)}</td>
            <td><div class="t-actions">
              <button class="icon-btn" style="width:30px;height:30px;background:none;" onclick="toast('Added to Liked Lectures','success')">${ICONS.heart}</button>
              <button class="icon-btn" style="width:30px;height:30px;background:none;" title="More options" aria-label="More options" aria-haspopup="menu" data-menu="lecture:${t.id}">${ICONS.more}</button>
            </div></td>
          </tr>`).join("")}
        </tbody>
      </table>

      <div class="grid grid-2" style="max-width:640px;margin:32px 0;">
        <div><div class="eyebrow">Publisher</div><div>${album.label}</div></div>
        <div><div class="eyebrow">Copyright</div><div class="text-secondary" style="font-size:13px;">${album.copyright}</div></div>
      </div>

      <div class="section-header" style="margin-top:8px;"><h2>More from ${artist.name}</h2></div>
      <div class="rail">${(moreFromArtist.length?moreFromArtist:ALBUMS.slice(0,6)).map(a=>cardHTML(a,"album")).join("")}</div>

      <div class="section-header"><h2>Similar Series</h2></div>
      <div class="rail">${(similarAlbums.length?similarAlbums:ALBUMS.slice(6,12)).map(a=>cardHTML(a,"album")).join("")}</div>

      <div class="section-header"><h2>Listener Discussion</h2></div>
      <div class="field" style="max-width:640px;">
        <textarea class="textarea" placeholder="Share your thoughts about this series..."></textarea>
        <button class="btn btn-primary" style="align-self:flex-end;" onclick="toast('Comment posted','success')">Post Comment</button>
      </div>
      <div style="max-width:640px;">
        ${albumComments.map(c=>`
        <div style="display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--border-subtle);">
          <img class="avatar" src="${c.avatar}" width="38" height="38" />
          <div style="flex:1;">
            <div style="display:flex;gap:8px;align-items:center;"><strong style="font-size:13.5px;">${c.user}</strong><span class="text-tertiary" style="font-size:12px;">${c.time}</span></div>
            <p style="font-size:13.5px;margin:4px 0 8px;">${c.body}</p>
            <div class="flex gap-16" style="font-size:12px;color:var(--text-secondary);">
              <button class="flex items-center gap-8" onclick="toast('Liked comment')">${ICONS.heart} ${c.likes}</button>
              <button onclick="toast('Reply box opened')">Reply</button>
              <button type="button" data-report="comment:${c.id}">Report</button>
            </div>
          </div>
        </div>`).join("")}
      </div>
    `;
  </script>
</body>
</html>
