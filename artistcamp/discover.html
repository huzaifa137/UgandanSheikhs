<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Discover — Ugandan Sheikhs</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/theme-ocean.css" />
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="shell-sidebar"></aside>
    <div class="main">
      <header class="topbar" id="shell-topbar"></header>
      <main class="content">

        <div class="page-header">
          <div><h1>Discover Knowledge</h1><p>Find your next beneficial lecture.</p></div>
        </div>

        <div id="genres"><div class="chip-row" id="genre-chips" style="margin-bottom:18px;"></div></div>

        <div class="section-header" style="margin-top:8px;"><h2>Listen by Moment</h2></div>
        <div class="chip-row" id="mood-chips" style="margin-bottom:8px;"></div>

        <section id="trending"><div class="section-header"><h2>Trending Sheikhs</h2></div><div class="rail" id="trending-artists"></div></section>
        <section><div class="section-header"><h2>Recommended for You</h2></div><div class="grid grid-6" id="recommended"></div></section>
        <section><div class="section-header"><h2>Rising Sheikhs</h2></div><div class="rail" id="rising-artists"></div></section>
        <section id="new"><div class="section-header"><h2>New This Week</h2></div><div class="grid grid-6" id="new-week"></div></section>
        <section><div class="section-header"><h2>Hidden Gems</h2></div><div class="rail" id="hidden-gems"></div></section>
        <section><div class="section-header"><h2>Editor's Choice</h2></div><div class="grid grid-3" id="editor-choice"></div></section>
        <section><div class="section-header"><h2>Most Downloaded</h2></div>
          <table class="track-table"><thead><tr><th>#</th><th>Lecture</th><th>Downloads</th><th>Time</th><th></th></tr></thead><tbody id="most-downloaded"></tbody></table>
        </section>
        <section><div class="section-header"><h2>Most Discussed Lectures</h2></div>
          <table class="track-table"><thead><tr><th>#</th><th>Lecture</th><th>Comments</th><th>Time</th><th></th></tr></thead><tbody id="most-discussed"></tbody></table>
        </section>
        <div id="discover-empty"></div>

      </main>
    </div>
  </div>

  <div class="player" id="shell-player"></div>
  <div class="mini-player" id="shell-mini-player"></div>
  <nav class="mobile-nav" id="shell-mobilenav"></nav>
  <div id="shell-overlays"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
  <script>
    initAppPage("discover");

    /* ---- "Listen by Moment": still highlight-only (needs a rule for what counts as a Commute / Study lecture) ---- */
    const moodChips = document.getElementById("mood-chips");
    moodChips.innerHTML = ["Morning","Commute","Before Sleep","Friday","Ramadan","Study","Reflection","Under 15 min","Long-form"].map(m => `<button class="chip">${m}</button>`).join("");
    wireChips(moodChips);

    /* ---- Topic chips: filter every section below (topic = null means all topics) ---- */
    // a sheikh "is on" a topic when at least one of their lectures is
    const sheikhsOn = (list, topic) => topic ? list.filter(a => TRACKS.some(t => t.artistId === a.id && t.genre === topic)) : list;
    const byTopic = (list, topic) => topic ? list.filter(x => x.genre === topic) : list;

    const editorCardHTML = a => `
      <a class="card" href="album.html?id=${a.id}" style="display:flex;gap:14px;align-items:center;padding:14px;">
        <img src="${a.art}" style="width:74px;height:74px;border-radius:8px;object-fit:cover;flex-shrink:0;" />
        <div><div class="eyebrow" style="margin-bottom:4px;">Editor's Choice</div><div class="card-title">${a.title}</div><div class="card-sub">${a.artist}</div></div>
      </a>`;
    const downloadedRowHTML = (t,i) => `<tr class="track-row"><td class="t-num"><span class="num">${i+1}</span></td><td><div class="t-title-cell"><img src="${t.art}"/><div><div class="t-title">${t.title}</div><a class="t-artist" href="artist.html?id=${t.artistId}">${t.artist}</a></div></div></td><td class="t-meta">${fmtCount(t.downloads)}</td><td class="t-meta">${fmtDuration(t.duration)}</td><td><div class="t-actions"><button class="icon-btn" style="width:30px;height:30px;background:none;" onclick="toast('Download started')">${ICONS.download}</button></div></td></tr>`;
    const discussedRowHTML = (t,i) => `<tr class="track-row"><td class="t-num"><span class="num">${i+1}</span></td><td><div class="t-title-cell"><img src="${t.art}"/><div><div class="t-title">${t.title}</div><a class="t-artist" href="artist.html?id=${t.artistId}">${t.artist}</a></div></div></td><td class="t-meta">${(t.likes % 200)+12} comments</td><td class="t-meta">${fmtDuration(t.duration)}</td><td><div class="t-actions"><a class="icon-btn" style="width:30px;height:30px;background:none;" href="track.html?id=${t.id}">${ICONS.message}</a></div></td></tr>`;

    function renderDiscover(topic) {
      const sections = [
        ["trending-artists", sheikhsOn(ARTISTS.slice(0, 10), topic),                    a => cardHTML(a, "artist")],
        ["recommended",      byTopic(ALBUMS.slice(0, 6), topic),                         a => cardHTML(a, "album")],
        ["rising-artists",   sheikhsOn([...ARTISTS].reverse().slice(0, 8), topic),       a => cardHTML(a, "artist")],
        ["new-week",         byTopic(ALBUMS.slice(6, 12), topic),                        a => cardHTML(a, "album")],
        ["hidden-gems",      sheikhsOn(ARTISTS.filter(a => !a.verified), topic),         a => cardHTML(a, "artist")],
        ["editor-choice",    byTopic(ALBUMS.slice(12, 15), topic),                       editorCardHTML],
        ["most-downloaded",  byTopic([...TRACKS].sort((a,b)=>b.downloads-a.downloads), topic).slice(0,8), downloadedRowHTML],
        ["most-discussed",   byTopic([...TRACKS].sort((a,b)=>b.likes-a.likes), topic).slice(0,8),         discussedRowHTML],
      ];
      let visible = 0;
      sections.forEach(([id, items, html]) => {
        const el = document.getElementById(id);
        el.innerHTML = items.map(html).join("");
        el.closest("section").style.display = items.length ? "" : "none";   // no empty headings
        if (items.length) visible++;
      });
      document.getElementById("discover-empty").innerHTML = visible ? "" : emptyStateHTML({
        icon: "compass", title: "Nothing here yet", body: `No lectures on ${escapeHTML(topic)} have been published yet.`,
      });
    }

    const genreChips = document.getElementById("genre-chips");
    genreChips.innerHTML = ["All", ...GENRES.map(g => g.name)].map((g, i) =>
      `<button class="chip ${i===0?"active":""}" data-topic="${i===0 ? "" : escapeHTML(g)}">${g}</button>`).join("");
    wireChips(genreChips, { onChange: (_, chip) => renderDiscover(chip.dataset.topic || null) });
    renderDiscover(null);

    // Search page "Browse Topics" tiles link here as discover.html?genre=<slug>
    const wanted = GENRES.find(g => g.slug === new URLSearchParams(location.search).get("genre"));
    if (wanted) [...genreChips.children].find(c => c.dataset.topic === wanted.name)?.click();
  </script>
</body>
</html>
