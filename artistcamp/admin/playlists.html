<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collections — Ugandan Sheikhs Admin</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/theme-ocean.css" />
<script src="../js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png" />
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <div class="page-header"><div><h1 style="font-size:22px;">Collections</h1><p>Review user-created and editorial collections.</p></div></div>

        <div class="chip-row" style="margin-bottom:20px;" id="pl-chips">
          <button class="chip active">All</button><button class="chip">Editorial</button><button class="chip">User-Created</button><button class="chip">Featured</button>
        </div>

        <table class="data-table">
          <thead><tr><th>Collection</th><th>Creator</th><th>Lectures</th><th>Privacy</th><th>Updated</th><th></th></tr></thead>
          <tbody id="playlists-table"></tbody>
        </table>
        <div id="playlists-empty"></div>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/app.js"></script>
  <script>
    initAdminPage("playlists", "Collections");

    // "Featured" = the same five collections shown as Promoted Collections on admin/featured.html
    const FEATURED = new Set(PLAYLISTS.slice(0, 5).map(p => p.id));
    const isEditorial = (p) => /editorial/i.test(p.creator);

    const PL_FILTERS = {
      "All":          () => true,
      "Editorial":    (tr) => tr.dataset.editorial === "true",
      "User-Created": (tr) => tr.dataset.editorial !== "true",
      "Featured":     (tr) => tr.dataset.featured === "true",
    };
    let plFilter = "All";
    function applyPlaylistFilter() {
      let shown = 0;
      document.querySelectorAll("#playlists-table tr").forEach(tr => {
        const show = (PL_FILTERS[plFilter] || PL_FILTERS.All)(tr);
        tr.style.display = show ? "" : "none";
        if (show) shown++;
      });
      document.getElementById("playlists-empty").innerHTML = shown ? "" : emptyStateHTML({
        icon: "layers",
        title: plFilter === "All" ? "No collections" : `No ${plFilter.toLowerCase()} collections`,
        body: "Nothing to review in this view right now.",
      });
    }
    wireChips(document.getElementById("pl-chips"), { onChange: (value) => { plFilter = value; applyPlaylistFilter(); } });

    function featureCollection(btn) {
      btn.closest("tr").dataset.featured = "true";
      applyPlaylistFilter();
      toast("Collection featured on homepage", "success");
    }

    document.getElementById("playlists-table").innerHTML = PLAYLISTS.map(p => `
      <tr data-editorial="${isEditorial(p)}" data-featured="${FEATURED.has(p.id)}">
        <td class="flex items-center gap-8"><img src="${p.art}" style="width:32px;height:32px;border-radius:5px;object-fit:cover;"/>${p.name}</td>
        <td>${p.creator}</td>
        <td>${p.tracks.length}</td>
        <td><span class="badge ${p.privacy==='Public'?'badge-success':'badge-neutral'}">${p.privacy}</span></td>
        <td class="text-secondary">${p.updated}</td>
        <td><div class="flex gap-8">
          <a class="icon-btn" style="width:30px;height:30px;" href="../playlist.html?id=${p.id}" title="View">${ICONS.eye}</a>
          <button class="icon-btn" style="width:30px;height:30px;" title="Feature" onclick="featureCollection(this)">${ICONS.star}</button>
          <button class="icon-btn" style="width:30px;height:30px;color:var(--error);" title="Remove" onclick="this.closest('tr').remove();applyPlaylistFilter();toast('Collection removed','warning')">${ICONS.trash}</button>
        </div></td>
      </tr>`).join("");
  </script>
</body>
</html>
