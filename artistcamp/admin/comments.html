<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comments — Ugandan Sheikhs Admin</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/theme-ocean.css" />
<script src="../js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png" />
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <div class="page-header"><div><h1 style="font-size:22px;">Comments</h1><p>Moderate listener discussion across the platform.</p></div></div>

        <div class="chip-row" id="status-chips" style="margin-bottom:20px;">
          <button class="chip active">All</button><button class="chip">Pending</button><button class="chip">Approved</button><button class="chip">Reported</button><button class="chip">Hidden</button>
        </div>

        <table class="data-table">
          <thead><tr><th>User</th><th>Lecture</th><th>Comment</th><th>Date</th><th>Likes</th><th>Reports</th><th>Status</th><th></th></tr></thead>
          <tbody id="comments-table"></tbody>
        </table>

        <div class="drawer" id="comment-drawer">
          <div class="drawer-head"><h3 style="font-size:17px;">Comment Thread</h3><button class="icon-btn" onclick="closeModals()" id="comment-drawer-close"></button></div>
          <div class="drawer-body" id="comment-drawer-body"></div>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/app.js"></script>
  <script>
    initAdminPage("comments", "Comments");
    document.getElementById("comment-drawer-close").innerHTML = ICONS.x;
    wireChips(document.getElementById("status-chips"));

    function row(c) {
      const track = TRACKS.find(t => t.id === c.trackId) || TRACKS[0];
      const statusBadge = { Approved: "badge-success", Pending: "badge-warning", Reported: "badge-error", Hidden: "badge-neutral" }[c.status];
      return `<tr>
        <td class="flex items-center gap-8"><img class="avatar" src="${c.avatar}" width="26" height="26"/>${c.user}</td>
        <td class="truncate" style="max-width:120px;">${track.title}</td>
        <td class="truncate" style="max-width:260px;">${c.body}</td>
        <td class="text-secondary">${c.time}</td>
        <td>${c.likes}</td>
        <td>${c.status === "Reported" ? Math.ceil(c.likes/60)+1 : 0}</td>
        <td><span class="badge ${statusBadge}">${c.status}</span></td>
        <td><div class="flex gap-8">
          <button class="icon-btn" style="width:30px;height:30px;color:var(--success);" title="Approve" onclick="toast('Comment approved','success')">${ICONS.check}</button>
          <button class="icon-btn" style="width:30px;height:30px;" title="Hide" onclick="toast('Comment hidden','warning')">${ICONS.cloudOff}</button>
          <button class="icon-btn" style="width:30px;height:30px;color:var(--error);" title="Delete" onclick="this.closest('tr').remove();toast('Comment deleted','warning')">${ICONS.trash}</button>
          <button class="icon-btn" style="width:30px;height:30px;" title="View Thread" onclick='openThread(${JSON.stringify(c).replace(/'/g,"&apos;")})'>${ICONS.message}</button>
        </div></td>
      </tr>`;
    }
    document.getElementById("comments-table").innerHTML = COMMENTS.map(row).join("");

    function openThread(c) {
      document.getElementById("comment-drawer-body").innerHTML = `
        <div style="display:flex;gap:10px;margin-bottom:16px;">
          <img class="avatar" src="${c.avatar}" width="34" height="34" />
          <div><strong style="font-size:13.5px;">${c.user}</strong><div class="text-tertiary" style="font-size:11.5px;">${c.time}</div></div>
        </div>
        <p style="font-size:13.5px;margin-bottom:16px;">${c.body}</p>
        <div class="nav-group-label">Replies</div>
        <div style="padding:20px 0;color:var(--text-tertiary);font-size:13px;">No replies on this comment yet.</div>
      `;
      ensureOverlay();
      openDrawer("comment-drawer");
    }
  </script>
</body>
</html>
