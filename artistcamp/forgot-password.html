<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — Ugandan Sheikhs</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/theme-ocean.css" />
<script src="js/theme.js"></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-visual">
      <img src="img/pattern-auth.svg" alt="" />
      <p class="quote">"Back in a moment — your lectures are waiting."</p>
    </div>
    <div class="auth-form-wrap">
      <div class="auth-form">
        <a href="index.html" style="display:inline-flex;align-items:center;gap:9px;margin-bottom:36px;">
          <span class="mark" style="width:30px;height:30px;border-radius:8px;background:linear-gradient(155deg,var(--accent),var(--accent-active));display:flex;align-items:center;justify-content:center;"></span>
          <span style="font-family:var(--font-display);font-weight:600;font-size:18px;">Ugandan Sheikhs</span>
        </a>
        <h1>Reset your password</h1>
        <p>Enter the email on your account and we'll send a reset link.</p>
        <div id="fp-request">
        <form id="fp-real-form" onsubmit="event.preventDefault();document.getElementById('fp-request').style.display='none';document.getElementById('fp-sent').style.display='block';">
          <div class="field"><label>Email</label><input class="input" type="email" placeholder="you@example.com" required /></div>
          <button class="btn btn-primary" type="submit" style="width:100%;" id="fp-submit">Send Reset Link</button>
        </form>
        </div>
        <div id="fp-sent" style="display:none;text-align:center;padding:24px 0;">
          <div class="icon-wrap" style="width:52px;height:52px;border-radius:50%;background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;"></div>
          <p style="font-size:14px;">Check your inbox — we've sent a reset link.</p>
        </div>
        <p style="text-align:center;font-size:13px;color:var(--text-secondary);margin-top:26px;"><a href="login.html" style="color:var(--accent);font-weight:600;">Back to sign in</a></p>
      </div>
    </div>
  </div>
  <script src="js/icons.js"></script>
  <script>document.querySelector("#fp-sent .icon-wrap").innerHTML = ICONS.check;</script>
</body>
</html>
