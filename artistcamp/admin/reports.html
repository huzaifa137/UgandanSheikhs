<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports — Ugandan Sheikhs Admin</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/theme-ocean.css" />
<script src="../js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png" />
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <div class="page-header"><div><h1 style="font-size:22px;">Reports</h1><p>Problems reported by listeners, with where they were reported from.</p></div></div>

        <table class="data-table">
          <thead><tr><th>Type</th><th>Content</th><th>Found On</th><th>Reason</th><th>Message</th><th>Reported By</th><th>Date</th><th>Status</th><th></th></tr></thead>
          <tbody id="reports-table"></tbody>
        </table>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/app.js"></script>
  <script>
    initAdminPage("reports", "Reports");
    const fmtWhen = (iso) => { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };

    // seeded examples (flagged comments) + real reports sent from the listener app (stored in this browser)
    const seeded = COMMENTS.filter(c => c.status === "Reported").map((c, i) => ({
      id: `seed-${c.id}`, type: "Comment", title: c.body.slice(0, 42) + "…", place: "Lecture page", source: "Comments",
      reason: ["Inappropriate or disrespectful content", "Something else", "Incorrect or misleading content"][i % 3],
      message: "Flagged by a listener.", by: ["Aisha K.", "Yusuf A.", "Kwame O."][i % 3], date: c.time, status: i % 2 === 0 ? "Open" : "Resolved", seeded: true,
    }));
    let reports = [...loadReports(), ...seeded];

    function renderReports() {
      document.getElementById("reports-table").innerHTML = reports.length ? reports.map(r => `
        <tr data-id="${r.id}">
          <td><span class="badge badge-neutral">${escapeHTML(r.type)}</span></td>
          <td class="truncate" style="max-width:220px;" title="${escapeHTML(r.title)}">${escapeHTML(r.title)}</td>
          <td>${escapeHTML(r.place)}${r.source ? `<div class="text-tertiary" style="font-size:12px;">${escapeHTML(r.source)}</div>` : ""}</td>
          <td>${escapeHTML(r.reason)}</td>
          <td style="max-width:280px;white-space:normal;" title="${escapeHTML(r.message)}">${escapeHTML(r.message)}</td>
          <td>${escapeHTML(r.by)}</td>
          <td class="text-secondary">${escapeHTML(fmtWhen(r.date))}</td>
          <td><span class="badge ${r.status==='Open'?'badge-warning':'badge-success'}">${r.status}</span></td>
          <td><div class="flex gap-8">
            <button class="icon-btn" style="width:30px;height:30px;color:var(--success);" title="Mark resolved" aria-label="Mark resolved" data-act="resolve">${ICONS.check}</button>
            <button class="icon-btn" style="width:30px;height:30px;color:var(--error);" title="Delete report" aria-label="Delete report" data-act="remove">${ICONS.trash}</button>
          </div></td>
        </tr>`).join("") : `<tr><td colspan="9"><div class="empty-state"><div class="icon-wrap">${ICONS.flag}</div><h3>No reports</h3><p>Problems reported by listeners will show up here.</p></div></td></tr>`;
      labelTables();
    }
    document.getElementById("reports-table").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act]"); if (!btn) return;
      const id = btn.closest("tr").dataset.id;
      const r = reports.find(x => x.id === id); if (!r) return;
      if (btn.dataset.act === "resolve") { r.status = "Resolved"; toast("Report resolved", "success"); }
      else { reports = reports.filter(x => x.id !== id); toast("Report deleted", "warning"); }
      saveReports(reports.filter(x => !x.seeded));
      renderReports();
    });
    renderReports();
  </script>
</body>
</html>
