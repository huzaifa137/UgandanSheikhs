<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Library — Ugandan Sheikhs</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/theme-ocean.css" />
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="shell-sidebar"></aside>
    <div class="main">
      <header class="topbar" id="shell-topbar"></header>
      <main class="content">

        <div class="page-header">
          <div><h1>Your Library</h1><p>Everything you've saved, followed, and downloaded.</p></div>
          <div class="lib-tools">
            <select class="select" id="lib-sort" aria-label="Sort library">
              <option>Recently Added</option><option>Recently Played</option><option>Alphabetical</option><option>Creator</option>
            </select>
            <div class="view-toggle" role="group" aria-label="View">
              <button class="icon-btn active" id="view-grid" title="Grid view" aria-label="Grid view" aria-pressed="true"></button>
              <button class="icon-btn" id="view-list" title="List view" aria-label="List view" aria-pressed="false"></button>
            </div>
          </div>
        </div>

        <div class="tabs tabs-grid3" id="lib-tabs">
          <button class="tab active" data-target="overview">Overview</button>
          <button class="tab" data-target="playlists">Collections</button>
          <button class="tab" data-target="albums">Series</button>
          <button class="tab" data-target="artists">Sheikhs</button>
          <button class="tab" data-target="liked">Liked Lectures</button>
          <button class="tab" data-target="downloads">Downloads</button>
        </div>

        <div data-tabpanel="overview">
          <div class="section-header" style="margin-top:0;"><h2>Collections</h2></div>
          <div class="grid grid-6" id="lib-playlists"></div>
          <div class="section-header"><h2>Series</h2></div>
          <div class="grid grid-6" id="lib-albums"></div>
          <div class="section-header"><h2>Sheikhs You Follow</h2></div>
          <div class="grid grid-6" id="lib-artists"></div>
        </div>

        <div data-tabpanel="playlists" style="display:none;">
          <div class="grid grid-6" id="lib-playlists-2"></div>
        </div>
        <div data-tabpanel="albums" style="display:none;">
          <div class="grid grid-6" id="lib-albums-2"></div>
        </div>
        <div data-tabpanel="artists" style="display:none;">
          <div class="grid grid-6" id="lib-artists-2"></div>
        </div>
        <div data-tabpanel="liked" style="display:none;">
          <div id="lib-liked"></div>
        </div>
        <div data-tabpanel="downloads" style="display:none;">
          <div id="lib-downloads"></div>
        </div>

      </main>
    </div>
  </div>

  <div class="player" id="shell-player"></div>
  <div class="mini-player" id="shell-mini-player"></div>
  <nav class="mobile-nav" id="shell-mobilenav"></nav>
  <div id="shell-overlays"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
  <script>
    initAppPage("library");
    document.getElementById("view-grid").innerHTML = ICONS.grid;
    document.getElementById("view-list").innerHTML = ICONS.queue;

    wireTabs(document.getElementById("lib-tabs"));
    if (location.hash) {
      const id = location.hash.slice(1);
      const tab = document.querySelector(`.tab[data-target="${id}"]`);
      tab?.click();
    }

    /* ---------- sorting + grid/list view (applies to every tab) ---------- */
    let sortBy = "Recently Added", view = "grid";
    const nameOf = (x) => x.name || x.title;
    const creatorOf = (x) => x.creator || x.artist || x.name;      // collection → creator, series/lecture → sheikh, sheikh → self
    const SORTERS = {
      "Recently Added":  (items) => items,                           // data order = newest first
      "Recently Played": (items) => [...items].reverse(),            // placeholder until real play history exists
      "Alphabetical":    (items) => [...items].sort((a, b) => nameOf(a).localeCompare(nameOf(b))),
      "Creator":         (items) => [...items].sort((a, b) => creatorOf(a).localeCompare(creatorOf(b)) || nameOf(a).localeCompare(nameOf(b))),
    };

    const hrefOf = (item, kind) => kind === "artist" ? `artist.html?id=${item.id}` : kind === "album" ? `album.html?id=${item.id}` : kind === "track" ? `track.html?id=${item.id}` : `playlist.html?id=${item.id}`;
    const subOf = (item, kind) => kind === "artist" ? `${item.followers} followers` : kind === "album" ? `${item.artist} · ${item.type}` : kind === "track" ? item.artist : `By ${item.creator} · ${item.tracks.length} lectures`;
    const cardFor = (item, kind) => kind === "track" ? `
      <a class="card card-w" href="${hrefOf(item, kind)}">
        <div class="card-art"><img src="${item.art}" alt="${item.title}" loading="lazy" /></div>
        <div class="card-title truncate">${item.title}</div><div class="card-sub truncate">${item.artist}</div>
      </a>` : cardHTML(item, kind);
    const rowFor = (item, kind) => `
      <a class="lib-row" href="${hrefOf(item, kind)}">
        <img class="${kind === "artist" ? "round" : ""}" src="${item.img || item.art}" alt="" loading="lazy" />
        <span class="lib-row-text"><span class="lib-row-title truncate">${nameOf(item)}</span><span class="lib-row-sub truncate">${subOf(item, kind)}</span></span>
        <span class="lib-row-play" role="button" aria-label="Play" onclick="event.preventDefault();event.stopPropagation();toast('Playing ${nameOf(item).replace(/'/g, "")}')">${ICONS.play}</span>
      </a>`;

    const SECTIONS = [
      { id: "lib-playlists",   kind: "playlist", items: () => PLAYLISTS, limit: 6 },
      { id: "lib-albums",      kind: "album",    items: () => ALBUMS,    limit: 6 },
      { id: "lib-artists",     kind: "artist",   items: () => ARTISTS,   limit: 6 },
      { id: "lib-playlists-2", kind: "playlist", items: () => PLAYLISTS },
      { id: "lib-albums-2",    kind: "album",    items: () => ALBUMS },
      { id: "lib-artists-2",   kind: "artist",   items: () => ARTISTS },
      { id: "lib-liked",       kind: "track",    items: () => TRACKS.slice(0, 10), table: true },
      { id: "lib-downloads",   kind: "track",    items: () => TRACKS.filter(t => t.downloadable).slice(0, 10), table: true },
    ];
    // remember each container's original grid classes so Grid view can restore them
    SECTIONS.forEach(s => { s.el = document.getElementById(s.id); s.gridClass = s.el.className || "grid grid-6"; });

    function renderLibrary() {
      SECTIONS.forEach(s => {
        let items = SORTERS[sortBy](s.items());
        if (s.limit) items = items.slice(0, s.limit);
        if (view === "list") {
          s.el.className = s.table ? "" : "lib-list";
          s.el.innerHTML = s.table
            ? `<table class="track-table"><tbody>${items.map((t, i) => trackRowHTML(t, i, { album: true })).join("")}</tbody></table>`
            : items.map(i => rowFor(i, s.kind)).join("");
        } else {
          s.el.className = s.table ? "grid grid-6" : s.gridClass;
          s.el.innerHTML = items.map(i => cardFor(i, s.kind)).join("");
        }
      });
      document.getElementById("view-grid").classList.toggle("active", view === "grid");
      document.getElementById("view-list").classList.toggle("active", view === "list");
      document.getElementById("view-grid").setAttribute("aria-pressed", view === "grid");
      document.getElementById("view-list").setAttribute("aria-pressed", view === "list");
    }
    document.getElementById("lib-sort").addEventListener("change", (e) => { sortBy = e.target.value; renderLibrary(); });
    document.getElementById("view-grid").addEventListener("click", () => { view = "grid"; renderLibrary(); });
    document.getElementById("view-list").addEventListener("click", () => { view = "list"; renderLibrary(); });
    renderLibrary();
  </script>
</body>
</html>
