<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Users — Ugandan Sheikhs Admin</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/theme-ocean.css" />
<script src="../js/theme.js"></script>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <div class="page-header"><div><h1 style="font-size:22px;">Users</h1><p>View and manage Ugandan Sheikhs listener accounts.</p></div></div>

        <div class="table-toolbar">
          <div class="search-field" style="max-width:280px;" id="user-search-wrap"><input id="user-search" placeholder="Search users…" /></div>
          <select class="select" style="width:auto;"><option>All Status</option><option>Active</option><option>Suspended</option></select>
        </div>

        <table class="data-table">
          <thead><tr><th>User</th><th>Email</th><th>Collections</th><th>Downloads</th><th>Comments</th><th>Status</th><th>Joined</th><th></th></tr></thead>
          <tbody id="users-table"></tbody>
        </table>

        <div class="drawer" id="user-drawer">
          <div class="drawer-head"><h3 style="font-size:17px;">User Details</h3><button class="icon-btn" id="user-drawer-close" onclick="closeModals()"></button></div>
          <div class="drawer-body" id="user-drawer-body"></div>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/app.js"></script>
  <script>
    initAdminPage("users", "Users");
    document.getElementById("user-drawer-close").innerHTML = ICONS.x;
    document.getElementById("user-search-wrap").insertAdjacentHTML("afterbegin", ICONS.search);

    function row(u) {
      return `<tr>
        <td class="flex items-center gap-8"><img class="avatar" src="${u.avatar}" width="28" height="28"/>${u.name}</td>
        <td class="text-secondary">${u.email}</td>
        <td>${u.playlists}</td>
        <td>${u.downloads}</td>
        <td>${u.comments}</td>
        <td><span class="badge ${u.status==='Active'?'badge-success':'badge-error'}">${u.status}</span></td>
        <td class="text-secondary">${u.joined}</td>
        <td><div class="flex gap-8">
          <button class="icon-btn" style="width:30px;height:30px;" title="View" onclick='openUser(${JSON.stringify(u)})'>${ICONS.eye}</button>
          <button class="icon-btn" style="width:30px;height:30px;" title="Suspend" onclick="toast('User suspended','warning')">${ICONS.lock}</button>
          <button class="icon-btn" style="width:30px;height:30px;" title="Send Notification" onclick="toast('Notification sent','success')">${ICONS.bell}</button>
        </div></td>
      </tr>`;
    }
    document.getElementById("users-table").innerHTML = ADMIN_USERS.map(row).join("");
    document.getElementById("user-search").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      document.getElementById("users-table").innerHTML = ADMIN_USERS.filter(u => u.name.toLowerCase().includes(q)).map(row).join("");
    });

    function openUser(u) {
      document.getElementById("user-drawer-body").innerHTML = `
        <div style="text-align:center;padding:10px 0 20px;">
          <img class="avatar" src="${u.avatar}" width="72" height="72" style="margin:0 auto 12px;" />
          <div style="font-weight:600;font-size:16px;">${u.name}</div>
          <div class="text-secondary" style="font-size:13px;">${u.email}</div>
        </div>
        <div class="grid grid-2" style="margin-bottom:20px;">
          <div class="stat-card"><div class="label">Collections</div><div class="value" style="font-size:20px;">${u.playlists}</div></div>
          <div class="stat-card"><div class="label">Downloads</div><div class="value" style="font-size:20px;">${u.downloads}</div></div>
          <div class="stat-card"><div class="label">Comments</div><div class="value" style="font-size:20px;">${u.comments}</div></div>
          <div class="stat-card"><div class="label">Joined</div><div class="value" style="font-size:16px;">${u.joined}</div></div>
        </div>
        <div class="flex gap-8" style="flex-direction:column;">
          <button class="btn btn-secondary" style="width:100%;" onclick="toast('Notification sent','success')">Send Notification</button>
          <button class="btn btn-outline" style="width:100%;" onclick="toast('Account activated','success')">Activate</button>
          <button class="btn btn-danger" style="width:100%;" onclick="toast('Account suspended','warning')">Suspend</button>
          <button class="btn btn-danger" style="width:100%;" onclick="toast('Account deleted','warning')">Delete</button>
        </div>
      `;
      ensureOverlay();
      openDrawer("user-drawer");
    }
  </script>
</body>
</html>
