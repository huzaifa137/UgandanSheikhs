<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lectures — Ugandan Sheikhs Admin</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/theme-ocean.css" />
<script src="../js/theme.js"></script>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <div class="page-header">
          <div><h1 style="font-size:22px;">Lectures</h1><p>Manage every lecture in the Ugandan Sheikhs catalog.</p></div>
          <a class="btn btn-primary" href="tracks-upload.html" id="upload-cta"></a>
        </div>

        <div class="table-toolbar">
          <div class="search-field" style="max-width:280px;" id="track-search-wrap"><input id="track-search" placeholder="Search lectures…" /></div>
          <select class="select" style="width:auto;" id="genre-filter"><option value="">All Topics</option></select>
          <select class="select" style="width:auto;"><option>All Status</option><option>Published</option><option>Draft</option></select>
        </div>

        <table class="data-table">
          <thead><tr><th>Lecture</th><th>Sheikh</th><th>Series</th><th>Topic</th><th>Duration</th><th>Plays</th><th>Downloads</th><th>Status</th><th></th></tr></thead>
          <tbody id="tracks-table"></tbody>
        </table>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/app.js"></script>
  <script>
    initAdminPage("tracks", "Lectures");
    document.getElementById("upload-cta").innerHTML = ICONS.upload + "<span>Upload Lecture</span>";
    document.getElementById("track-search-wrap").insertAdjacentHTML("afterbegin", ICONS.search);
    document.getElementById("genre-filter").innerHTML += GENRES.map(g => `<option>${g.name}</option>`).join("");

    function row(t) {
      return `<tr>
        <td class="flex items-center gap-8"><img src="${t.art}" style="width:32px;height:32px;border-radius:5px;object-fit:cover;"/>${t.title}</td>
        <td>${t.artist}</td>
        <td class="truncate" style="max-width:140px;">${t.album}</td>
        <td>${t.genre}</td>
        <td>${fmtDuration(t.duration)}</td>
        <td>${fmtCount(t.plays)}</td>
        <td>${fmtCount(t.downloads)}</td>
        <td><span class="badge badge-success">Published</span></td>
        <td><div class="flex gap-8">
          <button class="icon-btn" style="width:30px;height:30px;" title="Edit" onclick="toast('Edit track form opened')">${ICONS.edit}</button>
          <button class="icon-btn" style="width:30px;height:30px;color:var(--error);" title="Delete" onclick="this.closest('tr').remove();toast('Lecture deleted','warning')">${ICONS.trash}</button>
        </div></td>
      </tr>`;
    }
    document.getElementById("tracks-table").innerHTML = TRACKS.map(row).join("");
    document.getElementById("track-search").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      document.getElementById("tracks-table").innerHTML = TRACKS.filter(t => t.title.toLowerCase().includes(q)).map(row).join("");
    });
  </script>
</body>
</html>
