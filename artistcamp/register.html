<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — Ugandan Sheikhs</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/theme-ocean.css" />
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-visual">
      <img class="auth-pattern" src="img/pattern-auth.svg" alt="" />
      <div class="auth-brand">
        <span class="logo-mark auth-logo"><img class="logo-blue" src="img/logo-mark-blue.png" alt="" /><img class="logo-green" src="img/logo-mark-green.png" alt="" /></span>
        <div class="auth-brand-name">Ugandan Sheikhs</div>
        <p class="quote">“Your daily reminders, lectures and series in one place.”</p>
      </div>
    </div>
    <div class="auth-form-wrap">
      <div class="auth-form">
        <a class="auth-form-brand" href="index.html" style="display:inline-flex;align-items:center;gap:9px;margin-bottom:36px;">
          <span class="logo-mark"><img class="logo-blue" src="img/logo-mark-blue.png" alt="" width="36" height="36" /><img class="logo-green" src="img/logo-mark-green.png" alt="" width="36" height="36" /></span>
          <span style="font-family:var(--font-display);font-weight:600;font-size:18px;">Ugandan Sheikhs</span>
        </a>
        <h1>Create your account</h1>
        <p>Join a community built around beneficial knowledge.</p>

        <form onsubmit="event.preventDefault();toast('Account created — check your email to verify','success');setTimeout(()=>location.href='verify-email.html',700);">
          <div class="field"><label>Full name</label><input class="input" type="text" placeholder="Jane Doe" required /></div>
          <div class="field"><label>Username</label><input class="input" type="text" placeholder="janedoe" required /></div>
          <div class="field"><label>Email</label><input class="input" type="email" placeholder="you@example.com" required /></div>
          <div class="field"><label>Password</label><input class="input" type="password" placeholder="••••••••" required /></div>
          <div class="field"><label>Confirm password</label><input class="input" type="password" placeholder="••••••••" required /></div>
          <label class="checkbox-row" style="margin-bottom:22px;"><input type="checkbox" required /> I agree to the Terms of Service and Privacy Policy</label>
          <button class="btn btn-primary" type="submit" style="width:100%;">Create Account</button>
        </form>

        <p style="text-align:center;font-size:13px;color:var(--text-secondary);margin-top:26px;">Already have an account? <a href="login.html" style="color:var(--accent);font-weight:600;">Sign in</a></p>
      </div>
    </div>
  </div>
</body>
</html>
