<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ugandan Sheikhs — Lectures from Sheikhs Across Uganda</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/theme-ocean.css" />
    <script src="js/theme.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="shell-sidebar"></aside>
        <div class="main">
            <header class="topbar" id="shell-topbar"></header>
            <main class="content" id="content">

                <section>
                    <div class="section-header">
                        <h2>Featured Sheikhs</h2><a class="see-all" href="discover.html">See all</a>
                    </div>
                    <div class="rail" id="featured-artists-rail"></div>
                </section>

                <section class="hero home-hero">
                    <div class="hero-copy">
                        <span class="eyebrow">Featured Series</span>
                        <h1 id="hero-title"></h1>
                        <p id="hero-sheikh" style="font-size:19px;font-weight:600;color:var(--text-primary);margin-bottom:6px;"></p>
                        <p id="hero-desc"></p>
                        <div class="hero-actions">
                            <button class="btn btn-primary" id="hero-play">Play Now</button>
                            <a class="btn btn-secondary" id="hero-view" href="#">View Series</a>
                            <button class="btn btn-outline" onclick="toast('Download started','success')">Download</button>
                        </div>
                    </div>
                    <div class="hero-art"><img id="hero-img" src="" alt="" /></div>
                    <div class="hero-dots" id="hero-dots" role="tablist" aria-label="Featured series"></div>
                </section>

                <section id="continue-section">
                    <div class="section-header">
                        <h2>Continue Listening</h2>
                        <div class="section-actions">
                            <button type="button" class="see-all" id="continue-clear">Clear</button>
                            <a class="see-all" href="history.html">See all</a>
                        </div>
                    </div>
                    <div class="rail" id="continue-rail"></div>
                </section>

                <section id="reading-section" style="display:none;">
                    <div class="section-header">
                        <h2>Continue Reading</h2><a class="see-all" href="library.html#books">My books</a>
                    </div>
                    <div class="rail" id="reading-rail"></div>
                </section>

                <section id="books-section" style="display:none;">
                    <div class="section-header">
                        <h2>Study With the Book</h2><a class="see-all" href="books.html">See all</a>
                    </div>
                    <div class="rail" id="books-rail"></div>
                </section>

                <section>
                    <div class="section-header">
                        <h2>Made For You</h2><a class="see-all" href="library.html#playlists">See all</a>
                    </div>
                    <div class="rail" id="madeforyou-rail"></div>
                </section>

                <section>
                    <div class="section-header">
                        <h2>Trending Now</h2><a class="see-all" href="discover.html#trending">See all</a>
                    </div>
                    <table class="track-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Lecture</th>
                                <th>Series</th>
                                <th>Plays</th>
                                <th>Time</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="trending-body"></tbody>
                    </table>
                </section>

                <section>
                    <div class="section-header">
                        <h2>New Lectures</h2><a class="see-all" href="discover.html#new">See all</a>
                    </div>
                    <div class="grid grid-6" id="new-releases-grid"></div>
                </section>


                <section>
                    <div class="section-header">
                        <h2>Topics</h2>
                    </div>
                    <div class="topic-grid" id="genre-grid"></div>
                </section>

                <section>
                    <div class="section-header">
                        <h2>Editor's Picks</h2>
                    </div>
                    <div class="grid grid-3" id="editors-grid"></div>
                </section>

                <section>
                    <div class="section-header">
                        <h2>Popular Collections</h2>
                    </div>
                    <div class="grid grid-5" id="popular-playlists-grid"></div>
                </section>

            </main>
        </div>
    </div>

    <div class="player" id="shell-player"></div>
    <div class="mini-player" id="shell-mini-player"></div>
    <nav class="mobile-nav" id="shell-mobilenav"></nav>
    <div id="shell-overlays"></div>

    <script src="js/data.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/app.js"></script>
    <script>
        initAppPage("home");

        /* Featured Series carousel: 5 series, advances every 7s, pauses on hover/focus,
           dots to jump, and no auto-advance when the visitor prefers reduced motion. */
        (function featuredCarousel() {
            const slides = ALBUMS.slice(0, 5);
            const hero = document.querySelector(".home-hero");
            const dots = document.getElementById("hero-dots");
            let cur = 0, timer = null;
            dots.innerHTML = slides.map((s, i) => `<button type="button" role="tab" aria-label="Featured series ${i + 1}: ${escapeHTML(s.title)}" data-i="${i}"></button>`).join("");
            function show(i) {
                cur = (i + slides.length) % slides.length;
                const f = slides[cur], sh = ARTISTS.find((a) => a.id === f.artistId) || ARTISTS[0];
                hero.classList.add("is-swapping");
                setTimeout(() => {
                    document.getElementById("hero-title").textContent = f.title;
                    document.getElementById("hero-sheikh").textContent = sh.name;
                    document.getElementById("hero-desc").textContent = f.description;
                    document.getElementById("hero-view").href = "album.html?id=" + f.id;
                    const img = document.getElementById("hero-img");
                    img.src = sh.img; img.alt = sh.name;
                    hero.classList.remove("is-swapping");
                }, first ? 0 : 220);
                first = false;
                dots.querySelectorAll("button").forEach((b, k) => { b.classList.toggle("active", k === cur); b.setAttribute("aria-selected", k === cur); });
            }
            let first = true;
            document.getElementById("hero-play").addEventListener("click", () => toast("Playing " + slides[cur].title));
            const start = () => { stop(); if (!matchMedia("(prefers-reduced-motion: reduce)").matches) timer = setInterval(() => show(cur + 1), 7000); };
            const stop = () => { clearInterval(timer); timer = null; };
            dots.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; show(Number(b.dataset.i)); start(); });
            hero.addEventListener("mouseenter", stop); hero.addEventListener("mouseleave", start);
            hero.addEventListener("focusin", stop); hero.addEventListener("focusout", start);
            document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
            // drag (mouse) or swipe (touch) the hero to move between series, like the Featured Sheikhs rail
            let dragX = null, dragged = false;
            hero.addEventListener("pointerdown", (e) => { if (e.button !== 0 || e.target.closest("button, a")) return; dragX = e.clientX; dragged = false; });
            window.addEventListener("pointermove", (e) => {
                if (dragX === null) return;
                if (Math.abs(e.clientX - dragX) > 8) { dragged = true; hero.classList.add("is-dragging"); }
            });
            window.addEventListener("pointerup", (e) => {
                if (dragX === null) return;
                const dx = e.clientX - dragX; dragX = null; hero.classList.remove("is-dragging");
                if (Math.abs(dx) > 50) { show(cur + (dx < 0 ? 1 : -1)); start(); }
            });
            window.addEventListener("pointercancel", () => { dragX = null; hero.classList.remove("is-dragging"); });
            hero.addEventListener("dragstart", (e) => e.preventDefault());
            hero.addEventListener("click", (e) => { if (dragged) { e.preventDefault(); e.stopPropagation(); dragged = false; } }, true);
            show(0); start();
        })();

        /* Continue Listening: with nothing left, the whole section (heading included) is hidden.
           Prototype: cleared in memory only, so a refresh brings the sample lectures back. */
        let continueItems = TRACKS.slice(0, 8);
        function renderContinue() {
            document.getElementById("continue-section").style.display = continueItems.length ? "" : "none";
            document.getElementById("continue-rail").innerHTML = continueItems.map((t) => `
      <div class="card card-w" data-id="${t.id}" onclick="toast('Resuming ${t.title.replace(/'/g, "")}')" style="cursor:pointer;">
        <div class="card-art"><img src="${t.art}" alt="${t.title}" /><span class="card-play">${ICONS.play}</span>
          <button type="button" class="card-remove" title="Remove" aria-label="Remove from Continue Listening" data-remove="${t.id}">${ICONS.x}</button></div>
        <div class="card-title truncate">${t.title}</div>
        <div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:${20 + (t.plays % 70)}%"></div></div>
      </div>`).join("");
        }
        document.getElementById("continue-rail").addEventListener("click", (e) => {
            const rm = e.target.closest("[data-remove]");
            if (!rm) return;
            e.stopPropagation();
            continueItems = continueItems.filter((t) => t.id !== rm.dataset.remove);
            renderContinue();
            toast("Removed from Continue Listening");
        }, true);
        document.getElementById("continue-clear").addEventListener("click", () => {
            continueItems = [];
            renderContinue();
            toast("Continue Listening cleared");
        });
        renderContinue();

        /* Books: "Continue Reading" only when there is something to continue; the books rail hides when empty */
        function renderBooksHome() {
            const reading = BookShelf.continueReading();
            document.getElementById("reading-section").style.display = reading.length ? "" : "none";
            document.getElementById("reading-rail").innerHTML = reading.map((x) => bookCardHTML(x.book)).join("");
            const books = publishedBooks();
            document.getElementById("books-section").style.display = books.length ? "" : "none";
            document.getElementById("books-rail").innerHTML = books.map((b) => bookCardHTML(b)).join("");
        }
        renderBooksHome();
        window.addEventListener("pageshow", renderBooksHome);   // coming back from the reader

        document.getElementById("madeforyou-rail").innerHTML = visibleCollections().slice(0, 6).map((p) => cardHTML(p, "playlist")).join("");

        document.getElementById("trending-body").innerHTML = TRACKS.slice(0, 8)
            .sort((a, b) => b.plays - a.plays)
            .map((t, i) => trackRowHTML(t, i, {
                album: true
            })).join("");

        document.getElementById("new-releases-grid").innerHTML = ALBUMS.slice(0, 6).map((a) => cardHTML(a, "album")).join("");

        document.getElementById("featured-artists-rail").innerHTML = ARTISTS.slice(0, 10).map((a) => `
      <div class="card card-w artist">
        <a href="artist.html?id=${a.id}">
          <div class="card-art"><img src="${a.img}" alt="${a.name}" /></div>
          <div class="card-title truncate">${a.name} ${a.verified ? '<svg class="verified" viewBox="0 0 24 24" fill="currentColor" style="display:inline;vertical-align:-2px;"><path d="M12 2l2.4 2.1 3.1-.6 1 3 2.8 1.5-.6 3.1L23 14l-2.3 2.4.6 3.1-2.8 1.5-1 3-3.1-.6L12 26l-2.4-2.1-3.1.6-1-3-2.8-1.5.6-3.1L1 14l2.3-2.4-.6-3.1L5.5 7l1-3 3.1.6z"/></svg>' : ""}</div>
          <div class="card-sub">${a.genre} · ${fmtCount(parseFloat(a.followers) * 1000)} followers</div>
        </a>
        <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;" onclick="this.textContent=this.textContent==='Follow'?'Following':'Follow';toast(this.textContent==='Following'?'Following '+ '${a.name}'.replace(/'/g,''):'Unfollowed')">Follow</button>
      </div>`).join("");

        document.getElementById("genre-grid").innerHTML = GENRES.map(topicTileHTML).join("");

        document.getElementById("editors-grid").innerHTML = ALBUMS.slice(6, 9).map((a) => `
      <a class="card" href="album.html?id=${a.id}" style="display:flex;gap:14px;align-items:center;padding:14px;">
        <img src="${a.art}" style="width:74px;height:74px;border-radius:8px;object-fit:cover;flex-shrink:0;" />
        <div>
          <div class="eyebrow" style="margin-bottom:4px;">Editor's Pick</div>
          <div class="card-title">${a.title}</div>
          <div class="card-sub">${a.artist} — ${a.genre} series from ${a.year}.</div>
        </div>
      </a>`).join("");

        document.getElementById("popular-playlists-grid").innerHTML = officialCollections().slice(0, 5).map((p) => cardHTML(p, "playlist")).join("");
    </script>
</body>

</html>
