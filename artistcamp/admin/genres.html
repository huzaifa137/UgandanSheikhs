<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Topics — Ugandan Sheikhs Admin</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/theme-ocean.css" />
<script src="../js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png" />
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <div class="page-header">
          <div><h1 style="font-size:22px;">Topics</h1><p>Manage the topics used across Ugandan Sheikhs.</p></div>
          <button class="btn btn-primary" id="add-genre-btn" onclick="toast('Add genre form opened')"></button>
        </div>

        <table class="data-table">
          <thead><tr><th>Topic</th><th>Slug</th><th>Sheikhs</th><th>Lectures</th><th>Color</th><th></th></tr></thead>
          <tbody id="genres-table"></tbody>
        </table>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/app.js"></script>
  <script>
    initAdminPage("genres", "Topics");
    document.getElementById("add-genre-btn").innerHTML = ICONS.plus + "<span>Add Topic</span>";
    document.getElementById("genres-table").innerHTML = GENRES.map(g => `
      <tr>
        <td style="font-weight:600;">${g.name}</td>
        <td class="text-secondary">${g.slug}</td>
        <td>${ARTISTS.filter(a=>a.genre===g.name).length}</td>
        <td>${TRACKS.filter(t=>t.genre===g.name).length}</td>
        <td><span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:${g.color};vertical-align:-3px;"></span> <span class="text-secondary">${g.color}</span></td>
        <td><div class="flex gap-8">
          <button class="icon-btn" style="width:30px;height:30px;" onclick="toast('Edit genre form opened')">${ICONS.edit}</button>
          <button class="icon-btn" style="width:30px;height:30px;color:var(--error);" onclick="this.closest('tr').remove();toast('Topic deleted','warning')">${ICONS.trash}</button>
        </div></td>
      </tr>`).join("");
  </script>
</body>
</html>
