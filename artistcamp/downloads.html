<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Downloads — Ugandan Sheikhs</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/theme-ocean.css" />
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="shell-sidebar"></aside>
    <div class="main">
      <header class="topbar" id="shell-topbar"></header>
      <main class="content">

        <div class="page-header"><div><h1>Downloads</h1><p>Manage the lectures you've saved for offline listening.</p></div></div>

        <div class="card" style="padding:20px;max-width:420px;margin-bottom:32px;">
          <div class="flex" style="justify-content:space-between;font-size:13.5px;font-weight:600;"><span>3.8 GB used by Ugandan Sheikhs</span><span class="text-secondary">of 16 GB free</span></div>
          <div class="storage-bar"><div class="fill" style="width:24%;"></div></div>
          <button class="btn btn-ghost btn-sm" style="padding-left:0;" onclick="toast('Storage settings opened')">Manage storage</button>
        </div>

        <div class="section-header" style="margin-top:0;"><h2>Downloaded Lectures</h2></div>
        <div id="downloaded-list"></div>

        <div class="section-header"><h2>Downloading</h2></div>
        <div id="downloading-list"></div>

        <div class="section-header"><h2>Waiting</h2></div>
        <div id="queued-list"></div>

        <div class="section-header"><h2>Failed Downloads</h2></div>
        <div id="failed-list"></div>

      </main>
    </div>
  </div>

  <div class="player" id="shell-player"></div>
  <div class="mini-player" id="shell-mini-player"></div>
  <nav class="mobile-nav" id="shell-mobilenav"></nav>
  <div id="shell-overlays"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
  <script>
    initAppPage("downloads");

    function downloadRow(t, status, progress) {
      const sizeMb = (2.4 + (t.duration % 60) / 40).toFixed(1);
      const statusMap = {
        downloaded: `<span class="badge badge-success">Downloaded</span>`,
        downloading: `<span class="badge badge-accent">Downloading</span>`,
        queued: `<span class="badge badge-neutral">Queued</span>`,
        failed: `<span class="badge badge-error">Failed</span>`,
      };
      const actions = {
        downloaded: `<button class="btn btn-ghost btn-sm" onclick="toast('Playing offline')">Play Offline</button><button class="btn btn-ghost btn-sm" onclick="this.closest('.dl-row').remove();toast('Download removed')">Remove</button>`,
        downloading: `<button class="btn btn-ghost btn-sm" onclick="toast('Download paused')">Pause</button><button class="btn btn-ghost btn-sm" onclick="this.closest('.dl-row').remove();toast('Download removed')">Remove</button>`,
        queued: `<button class="btn btn-ghost btn-sm" onclick="toast('Download resumed')">Resume</button><button class="btn btn-ghost btn-sm" onclick="this.closest('.dl-row').remove();toast('Download removed')">Remove</button>`,
        failed: `<button class="btn btn-ghost btn-sm" onclick="toast('Retrying download')">Retry</button><button class="btn btn-ghost btn-sm" onclick="this.closest('.dl-row').remove();toast('Download removed')">Remove</button>`,
      };
      return `
      <div class="dl-row card" style="display:flex;align-items:center;gap:14px;margin-bottom:10px;">
        <img src="${t.art}" style="width:52px;height:52px;border-radius:6px;object-fit:cover;" />
        <div style="flex:1;min-width:0;">
          <div class="truncate" style="font-weight:600;font-size:13.5px;">${t.title}</div>
          <div class="truncate text-secondary" style="font-size:12px;">${t.artist} · ${sizeMb} MB · High quality</div>
          ${status === "downloading" ? `<div class="progress-track" style="margin-top:6px;max-width:220px;"><div class="progress-fill" style="width:${progress}%;background:var(--accent);"></div></div>` : ""}
        </div>
        ${statusMap[status]}
        <div class="flex gap-8">${actions[status]}</div>
      </div>`;
    }

    document.getElementById("downloaded-list").innerHTML = TRACKS.slice(0,6).map(t=>downloadRow(t,"downloaded")).join("");
    document.getElementById("downloading-list").innerHTML = TRACKS.slice(6,8).map((t,i)=>downloadRow(t,"downloading",[62,28][i])).join("") || `<div class="empty-state" style="padding:32px;"><div class="icon-wrap">${ICONS.download}</div><h3>Nothing downloading</h3><p>Downloads you start will show progress here.</p></div>`;
    document.getElementById("queued-list").innerHTML = TRACKS.slice(8,10).map(t=>downloadRow(t,"queued")).join("");
    document.getElementById("failed-list").innerHTML = TRACKS.slice(10,11).map(t=>downloadRow(t,"failed")).join("") || `<div class="empty-state" style="padding:32px;"><div class="icon-wrap">${ICONS.check}</div><h3>No failed downloads</h3></div>`;
  </script>
</body>
</html>
