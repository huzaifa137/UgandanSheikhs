<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Following — Ugandan Sheikhs</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/theme-ocean.css" />
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="shell-sidebar"></aside>
    <div class="main">
      <header class="topbar" id="shell-topbar"></header>
      <main class="content">

        <div class="page-header">
          <div><h1>Following</h1><p>Sheikhs you follow, and their latest lectures.</p></div>
          <div class="chip-row" id="view-chips">
            <button class="chip active" data-view="grid">Grid</button>
            <button class="chip" data-view="list">List</button>
          </div>
        </div>

        <div class="grid grid-4" id="following-grid"></div>

      </main>
    </div>
  </div>

  <div class="player" id="shell-player"></div>
  <div class="mini-player" id="shell-mini-player"></div>
  <nav class="mobile-nav" id="shell-mobilenav"></nav>
  <div id="shell-overlays"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
  <script>
    initAppPage("following");
    // Grid = several cards per row, List = one wide row per sheikh
    wireChips(document.getElementById("view-chips"), {
      onChange: (_, chip) => { document.getElementById("following-grid").style.gridTemplateColumns = chip.dataset.view === "list" ? "1fr" : ""; },
    });

    document.getElementById("following-grid").innerHTML = ARTISTS.map(a => `
      <div class="card" style="display:flex;gap:14px;align-items:center;padding:16px;">
        <img src="${a.img}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;" />
        <div style="flex:1;min-width:0;">
          <a class="truncate" href="artist.html?id=${a.id}" style="font-weight:600;font-size:14px;">${a.name}</a>
          <div class="text-secondary truncate" style="font-size:12.5px;">${a.genre} · ${a.followers} followers</div>
          <div class="text-tertiary truncate" style="font-size:11.5px;margin-top:2px;">Latest: "${(ALBUMS.find(x => x.artistId === a.id) || {title: "New lectures"}).title}"</div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="this.textContent=this.textContent==='Following'?'Follow':'Following';toast(this.textContent==='Following'?'Unfollowed '+'${a.name}'.replace(/'/g,''):'Now following '+'${a.name}'.replace(/'/g,''))">Following</button>
      </div>`).join("");
  </script>
</body>
</html>
