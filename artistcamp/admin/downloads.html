<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Downloads — Ugandan Sheikhs Admin</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/theme-ocean.css" />
<script src="../js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png" />
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <div class="page-header"><div><h1 style="font-size:22px;">Downloads</h1><p>Platform-wide download activity and quotas.</p></div></div>

        <div class="grid grid-4" style="margin-bottom:28px;" id="dl-stat-cards"></div>

        <div class="section-header" style="margin-top:0;"><h2 style="font-size:16px;">Most Downloaded Lectures</h2></div>
        <table class="data-table">
          <thead><tr><th>Lecture</th><th>Sheikh</th><th>Downloads</th><th>Downloadable</th></tr></thead>
          <tbody id="downloads-table"></tbody>
        </table>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/app.js"></script>
  <script>
    initAdminPage("downloads", "Downloads");
    document.getElementById("dl-stat-cards").innerHTML = `
      <div class="stat-card"><div class="label">Total Downloads</div><div class="value">${fmtCount(TRACKS.reduce((s,t)=>s+t.downloads,0))}</div><div class="delta up">+6.4% this week</div></div>
      <div class="stat-card"><div class="label">Storage Used</div><div class="value">412 GB</div><div class="delta up">of 1 TB</div></div>
      <div class="stat-card"><div class="label">Most Downloaded</div><div class="value" style="font-size:16px;">${[...TRACKS].sort((a,b)=>b.downloads-a.downloads)[0].title}</div></div>
      <div class="stat-card"><div class="label">Downloads Today</div><div class="value">2,140</div><div class="delta up">+3.1%</div></div>
    `;
    document.getElementById("downloads-table").innerHTML = [...TRACKS].sort((a,b)=>b.downloads-a.downloads).slice(0,12).map(t => `
      <tr><td>${t.title}</td><td>${t.artist}</td><td>${fmtCount(t.downloads)}</td><td>${t.downloadable ? '<span class="badge badge-success">Enabled</span>' : '<span class="badge badge-neutral">Disabled</span>'}</td></tr>`).join("");
  </script>
</body>
</html>
