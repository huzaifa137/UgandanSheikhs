<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recently Played — Ugandan Sheikhs</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/theme-ocean.css" />
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="shell-sidebar"></aside>
    <div class="main">
      <header class="topbar" id="shell-topbar"></header>
      <main class="content">

        <div class="page-header">
          <div><h1>Recently Played</h1><p>Your listening history across Ugandan Sheikhs.</p></div>
          <button class="btn btn-secondary" onclick="document.getElementById('history-groups').innerHTML='';document.getElementById('history-empty').style.display='flex';this.style.display='none';toast('Listening history cleared')">Clear History</button>
        </div>

        <div id="history-groups"></div>
        <div class="empty-state" id="history-empty" style="display:none;">
          <div class="icon-wrap"></div>
          <h3>No listening history</h3>
          <p>Lectures you play will show up here, grouped by when you played them.</p>
        </div>

      </main>
    </div>
  </div>

  <div class="player" id="shell-player"></div>
  <div class="mini-player" id="shell-mini-player"></div>
  <nav class="mobile-nav" id="shell-mobilenav"></nav>
  <div id="shell-overlays"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
  <script>
    initAppPage("history");
    document.querySelector("#history-empty .icon-wrap").innerHTML = ICONS.clock;

    // Same information as the series page: lecture title, then the sheikh and the series it belongs to.
    function historyRow(t, time) {
      const series = seriesOf(t);
      const seriesName = series ? series.title : t.album;
      const seriesHref = series ? `album.html?id=${series.id}` : null;
      const seriesLink = seriesHref ? `<a href="${seriesHref}">${seriesName}</a>` : `<span>${seriesName}</span>`;
      return `<div class="hist-row">
        <img class="hist-art" src="${t.art}" alt="" />
        <div class="hist-main">
          <a class="hist-title truncate" href="track.html?id=${t.id}">${t.title}</a>
          <div class="hist-sub truncate"><a href="artist.html?id=${t.artistId}">${t.artist}</a><span class="hist-inline-series"> · ${seriesLink}</span></div>
        </div>
        <div class="hist-series truncate">${seriesLink}</div>
        <span class="hist-time">${time}</span>
        <button class="icon-btn hist-btn" title="Play" aria-label="Play" onclick="toast('Playing ${t.title.replace(/'/g,"")}')">${ICONS.play}</button>
        <button class="icon-btn hist-btn" title="More options" aria-label="More options" aria-haspopup="menu" data-menu="lecture:${t.id}">${ICONS.more}</button>
      </div>`;
    }

    const groups = [
      { label: "Today", tracks: TRACKS.slice(0,4), times: ["2:14 PM","11:02 AM","9:40 AM","8:15 AM"] },
      { label: "Yesterday", tracks: TRACKS.slice(4,8), times: ["9:50 PM","6:30 PM","1:12 PM","10:05 AM"] },
      { label: "This Week", tracks: TRACKS.slice(8,14), times: ["Mon","Mon","Sun","Sat","Sat","Fri"] },
      { label: "Earlier", tracks: TRACKS.slice(14,20), times: ["3 wks ago","3 wks ago","1 mo ago","1 mo ago","1 mo ago","2 mo ago"] },
    ];
    document.getElementById("history-groups").innerHTML = groups.map(g => `
      <div class="section-header" style="margin-top:32px;"><h2 style="font-size:17px;">${g.label}</h2></div>
      <div>${g.tracks.map((t,i)=>historyRow(t, g.times[i])).join("")}</div>
    `).join("");
  </script>
</body>
</html>
