<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Discover — Ugandan Sheikhs</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/theme-ocean.css" />
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="shell-sidebar"></aside>
    <div class="main">
      <header class="topbar" id="shell-topbar"></header>
      <main class="content">

        <div class="page-header">
          <div><h1>Discover Knowledge</h1><p>Find your next beneficial lecture.</p></div>
        </div>

        <!-- Topics: one scrolling row (never wraps, however many topics there are) + "All topics" picker -->
        <div id="genres" class="topic-bar">
          <div class="chip-scroller" id="topic-scroller">
            <button type="button" class="chip-nav prev" id="topic-prev" aria-label="Scroll topics left"></button>
            <div class="chip-track" id="genre-chips" role="tablist" aria-label="Topics"></div>
            <button type="button" class="chip-nav next" id="topic-next" aria-label="Scroll topics right"></button>
          </div>
          <button type="button" class="btn btn-secondary topic-all-btn" id="topic-all-btn"></button>
        </div>

        <!-- Moments: tile grid that shows the first few and expands on demand -->
        <section id="moments">
          <div class="section-header" style="margin-top:8px;"><h2>Listen by Moment</h2><button type="button" class="see-all" id="moment-toggle" hidden></button></div>
          <input class="input moment-search" id="moment-search" type="search" placeholder="Find a moment" aria-label="Find a moment" hidden />
          <div class="moment-grid collapsed" id="moment-grid"></div>
          <div id="moment-results"></div>
        </section>

        <section id="trending"><div class="section-header"><h2>Trending Sheikhs</h2></div><div class="rail" id="trending-artists"></div></section>
        <section><div class="section-header"><h2>Recommended for You</h2></div><div class="grid grid-6" id="recommended"></div></section>
        <section><div class="section-header"><h2>Sheikhs to Explore</h2></div><div class="rail" id="rising-artists"></div></section>
        <section id="new"><div class="section-header"><h2>New This Week</h2></div><div class="grid grid-6" id="new-week"></div></section>
        <section><div class="section-header"><h2>Hidden Gems</h2></div><div class="rail" id="hidden-gems"></div></section>
        <section><div class="section-header"><h2>Editor's Choice</h2></div><div class="grid grid-3" id="editor-choice"></div></section>
        <section><div class="section-header"><h2>Most Downloaded</h2></div>
          <table class="track-table"><thead><tr><th>#</th><th>Lecture</th><th>Downloads</th><th>Time</th><th></th></tr></thead><tbody id="most-downloaded"></tbody></table>
        </section>
        <section><div class="section-header"><h2>Most Discussed Lectures</h2></div>
          <table class="track-table"><thead><tr><th>#</th><th>Lecture</th><th>Comments</th><th>Time</th><th></th></tr></thead><tbody id="most-discussed"></tbody></table>
        </section>
        <div id="discover-empty"></div>

      </main>
    </div>
  </div>

  <div class="player" id="shell-player"></div>
  <div class="mini-player" id="shell-mini-player"></div>
  <nav class="mobile-nav" id="shell-mobilenav"></nav>
  <div id="shell-overlays"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
  <script>
    initAppPage("discover");

    /* ---- Topic chips: filter every section below (topic = null means all topics) ---- */
    // a sheikh "is on" a topic when at least one of their lectures is
    const sheikhsOn = (list, topic) => topic ? list.filter(a => TRACKS.some(t => t.artistId === a.id && t.genre === topic)) : list;
    const byTopic = (list, topic) => topic ? list.filter(x => x.genre === topic) : list;

    const editorCardHTML = a => `
      <a class="card" href="album.html?id=${a.id}" style="display:flex;gap:14px;align-items:center;padding:14px;">
        <img src="${a.art}" style="width:74px;height:74px;border-radius:8px;object-fit:cover;flex-shrink:0;" />
        <div><div class="eyebrow" style="margin-bottom:4px;">Editor's Choice</div><div class="card-title">${a.title}</div><div class="card-sub">${a.artist}</div></div>
      </a>`;
    // Rows in these two tables are clickable: the whole row opens the lecture (see wireRowLinks below).
    // The title is also a real link so keyboard / screen-reader / middle-click users get the same thing.
    const downloadedRowHTML = (t,i) => `<tr class="track-row is-link" data-href="track.html?id=${t.id}"><td class="t-num"><span class="num">${i+1}</span></td><td><div class="t-title-cell"><img src="${t.art}" alt=""/><div><a class="t-title t-title-link" href="track.html?id=${t.id}">${t.title}</a><a class="t-artist" href="artist.html?id=${t.artistId}">${t.artist}</a></div></div></td><td class="t-meta">${fmtCount(t.downloads)}</td><td class="t-meta">${fmtDuration(t.duration)}</td><td><div class="t-actions"><button class="icon-btn" style="width:30px;height:30px;background:none;" title="Download" aria-label="Download" onclick="toast('Download started')">${ICONS.download}</button></div></td></tr>`;
    // Most Discussed opens the lecture straight at its Comments section (#comments)
    const discussedRowHTML = (t,i) => `<tr class="track-row is-link" data-href="track.html?id=${t.id}#comments"><td class="t-num"><span class="num">${i+1}</span></td><td><div class="t-title-cell"><img src="${t.art}" alt=""/><div><a class="t-title t-title-link" href="track.html?id=${t.id}#comments">${t.title}</a><a class="t-artist" href="artist.html?id=${t.artistId}">${t.artist}</a></div></div></td><td class="t-meta">${(t.likes % 200)+12} comments</td><td class="t-meta">${fmtDuration(t.duration)}</td><td><div class="t-actions"><a class="icon-btn" style="width:30px;height:30px;background:none;" href="track.html?id=${t.id}#comments" title="View comments" aria-label="View comments">${ICONS.message}</a></div></td></tr>`;

    // One delegated listener per table (rows are re-rendered whenever a topic chip changes).
    // Clicks on real links/buttons (sheikh name, download, comment icon) keep their own behaviour.
    function wireRowLinks(tbodyId) {
      document.getElementById(tbodyId).addEventListener("click", (e) => {
        if (e.target.closest("a, button")) return;
        const row = e.target.closest("tr[data-href]");
        if (!row) return;
        if (e.metaKey || e.ctrlKey) window.open(row.dataset.href, "_blank");
        else location.href = row.dataset.href;
      });
    }
    wireRowLinks("most-downloaded");
    wireRowLinks("most-discussed");

    function renderDiscover(topic) {
      currentTopic = topic;
      if (typeof renderMoments === "function" && document.getElementById("moment-grid")) renderMoments();
      const sections = [
        ["trending-artists", sheikhsOn(ARTISTS.slice(0, 10), topic),                    a => cardHTML(a, "artist")],
        ["recommended",      byTopic(ALBUMS.slice(0, 6), topic),                         a => cardHTML(a, "album")],
        ["rising-artists",   sheikhsOn([...ARTISTS].reverse().slice(0, 8), topic),       a => cardHTML(a, "artist")],
        ["new-week",         byTopic(ALBUMS.slice(6, 12), topic),                        a => cardHTML(a, "album")],
        ["hidden-gems",      sheikhsOn(ARTISTS.filter(a => !a.verified), topic),         a => cardHTML(a, "artist")],
        ["editor-choice",    byTopic(ALBUMS.slice(12, 15), topic),                       editorCardHTML],
        ["most-downloaded",  byTopic([...TRACKS].sort((a,b)=>b.downloads-a.downloads), topic).slice(0,8), downloadedRowHTML],
        ["most-discussed",   byTopic([...TRACKS].sort((a,b)=>b.likes-a.likes), topic).slice(0,8),         discussedRowHTML],
      ];
      let visible = 0;
      sections.forEach(([id, items, html]) => {
        const el = document.getElementById(id);
        el.innerHTML = items.map(html).join("");
        el.closest("section").style.display = items.length ? "" : "none";   // no empty headings
        if (items.length) visible++;
      });
      document.getElementById("discover-empty").innerHTML = visible ? "" : emptyStateHTML({
        icon: "compass", title: "Nothing here yet", body: `No lectures on ${escapeHTML(topic)} have been published yet.`,
      });
    }

    /* ================= Topic bar ================= */
    let currentTopic = null;
    const topicCount = (name) => TRACKS.filter(t => t.genre === name).length;
    const genreChips = document.getElementById("genre-chips");
    genreChips.innerHTML = ["All", ...GENRES.map(g => g.name)].map((g, i) =>
      `<button class="chip ${i===0?"active":""}" role="tab" aria-selected="${i===0}" data-topic="${i===0 ? "" : escapeHTML(g)}">${escapeHTML(g)}</button>`).join("");
    wireChips(genreChips, { onChange: (_, chip) => {
      currentTopic = chip.dataset.topic || null;
      genreChips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-selected", c.classList.contains("active")));
      chip.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
      renderDiscover(currentTopic);
    } });

    // arrows + edge fades appear only when the row actually overflows
    const scroller = document.getElementById("topic-scroller");
    const updateScroller = () => {
      const max = genreChips.scrollWidth - genreChips.clientWidth;
      scroller.classList.toggle("can-left", genreChips.scrollLeft > 4);
      scroller.classList.toggle("can-right", genreChips.scrollLeft < max - 4);
    };
    document.getElementById("topic-prev").innerHTML = ICONS.chevLeft;
    document.getElementById("topic-next").innerHTML = ICONS.chevRight;
    document.getElementById("topic-prev").onclick = () => genreChips.scrollBy({ left: -genreChips.clientWidth * .7, behavior: "smooth" });
    document.getElementById("topic-next").onclick = () => genreChips.scrollBy({ left: genreChips.clientWidth * .7, behavior: "smooth" });
    genreChips.addEventListener("scroll", updateScroller, { passive: true });
    window.addEventListener("resize", updateScroller);

    // "All topics" picker: searchable list with lecture counts, for when there are dozens of topics
    document.getElementById("topic-all-btn").innerHTML = `${ICONS.grid}<span>All topics</span>`;
    document.getElementById("shell-overlays").insertAdjacentHTML("beforeend", `
      <div class="modal topic-modal" id="topic-modal" role="dialog" aria-modal="true" aria-label="All topics">
        <div class="modal-head"><h3>All topics</h3><button class="icon-btn" aria-label="Close" onclick="closeModals()">${ICONS.x}</button></div>
        <input class="input" id="topic-search" type="search" placeholder="Search topics" aria-label="Search topics" autocomplete="off" />
        <div class="topic-list" id="topic-list"></div>
      </div>`);
    function renderTopicList() {
      const q = document.getElementById("topic-search").value.trim().toLowerCase();
      const rows = [{ name: "All topics", value: "", n: TRACKS.length }, ...GENRES.map(g => ({ name: g.name, value: g.name, n: topicCount(g.name), color: g.color }))]
        .filter(r => !q || r.name.toLowerCase().includes(q));
      document.getElementById("topic-list").innerHTML = rows.length ? rows.map(r => `
        <button type="button" class="topic-row ${(currentTopic || "") === r.value ? "active" : ""}" data-topic="${escapeHTML(r.value)}">
          <span class="topic-dot" style="background:${r.color || "var(--accent)"};"></span><span class="topic-name">${escapeHTML(r.name)}</span><span class="topic-n">${r.n} lectures</span>
        </button>`).join("") : `<p class="text-secondary" style="padding:18px 4px;font-size:13.5px;">No topics match “${escapeHTML(q)}”.</p>`;
    }
    document.getElementById("topic-search").addEventListener("input", renderTopicList);
    document.getElementById("topic-list").addEventListener("click", (e) => {
      const row = e.target.closest(".topic-row");
      if (!row) return;
      closeModals();
      [...genreChips.children].find(c => c.dataset.topic === row.dataset.topic)?.click();
    });
    document.getElementById("topic-all-btn").addEventListener("click", () => {
      document.getElementById("topic-search").value = ""; renderTopicList();
      ensureOverlay(); openModal("topic-modal");
      document.getElementById("topic-search").focus();
    });

    /* ================= Listen by Moment ================= */
    const MOMENT_VISIBLE = 6;            // tiles shown before "Show all"
    let activeMoment = null, momentsExpanded = false;
    const momentTracks = (m) => TRACKS.filter(t => m.test(t) && (!currentTopic || t.genre === currentTopic));
    function renderMoments() {
      const grid = document.getElementById("moment-grid");
      const q = document.getElementById("moment-search").value.trim().toLowerCase();
      // moments with no lectures (for the chosen topic) are hidden completely, not shown disabled
      const available = MOMENTS.map(m => ({ m, n: momentTracks(m).length })).filter(x => x.n > 0);
      if (activeMoment && !available.some(x => x.m.id === activeMoment)) activeMoment = null;
      document.getElementById("moments").style.display = available.length ? "" : "none";
      const list = available.filter(({ m }) => !q || m.name.toLowerCase().includes(q) || m.hint.toLowerCase().includes(q));
      grid.innerHTML = list.map(({ m, n }) => {
        return `<button type="button" class="moment-tile ${activeMoment === m.id ? "active" : ""}" data-moment="${m.id}" aria-pressed="${activeMoment === m.id}">
          <span class="moment-ico">${ICONS[m.icon]}</span>
          <span class="moment-text"><strong>${m.name}</strong><small>${n} lecture${n === 1 ? "" : "s"} · ${m.hint}</small></span>
        </button>`;
      }).join("") || `<p class="text-secondary" style="font-size:13.5px;">No moments match “${escapeHTML(q)}”.</p>`;
      const many = available.length > MOMENT_VISIBLE;
      grid.classList.toggle("collapsed", many && !momentsExpanded && !q);
      const toggle = document.getElementById("moment-toggle");
      toggle.hidden = !many;
      toggle.textContent = momentsExpanded ? "Show less" : `Show all ${available.length}`;
      document.getElementById("moment-search").hidden = !(available.length > 12 && momentsExpanded);
      if (!available.length) { document.getElementById("moment-results").innerHTML = ""; return; }
      renderMomentResults();
    }
    function renderMomentResults() {
      const box = document.getElementById("moment-results");
      const m = MOMENTS.find(x => x.id === activeMoment);
      if (!m) { box.innerHTML = ""; return; }
      const list = momentTracks(m);
      box.innerHTML = `
        <div class="moment-results-head">
          <div><strong>${m.name}</strong><span class="text-secondary"> · ${list.length} lecture${list.length === 1 ? "" : "s"}${currentTopic ? ` on ${escapeHTML(currentTopic)}` : ""}</span></div>
          <button type="button" class="see-all" id="moment-clear">Clear</button>
        </div>
        ${list.length ? `<table class="track-table"><tbody>${list.slice(0, 8).map((t, i) => trackRowHTML(t, i, { album: true })).join("")}</tbody></table>
          ${list.length > 8 ? `<p class="text-tertiary" style="font-size:12.5px;margin-top:10px;">Showing 8 of ${list.length}</p>` : ""}`
          : `<p class="text-secondary" style="font-size:13.5px;padding:10px 0;">No ${m.name} lectures${currentTopic ? ` on ${escapeHTML(currentTopic)}` : ""} yet.</p>`}`;
      document.getElementById("moment-clear").onclick = () => { activeMoment = null; renderMoments(); };
    }
    document.getElementById("moment-grid").addEventListener("click", (e) => {
      const tile = e.target.closest(".moment-tile");
      if (!tile || tile.disabled) return;
      activeMoment = activeMoment === tile.dataset.moment ? null : tile.dataset.moment;
      renderMoments();
      if (activeMoment) document.getElementById("moment-results").scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
    document.getElementById("moment-toggle").onclick = () => { momentsExpanded = !momentsExpanded; renderMoments(); };
    document.getElementById("moment-search").addEventListener("input", renderMoments);

    renderDiscover(null);
    renderMoments();
    updateScroller();

    // Search page "Browse Topics" tiles link here as discover.html?genre=<slug>
    const wanted = GENRES.find(g => g.slug === new URLSearchParams(location.search).get("genre"));
    if (wanted) [...genreChips.children].find(c => c.dataset.topic === wanted.name)?.click();
  </script>
</body>
</html>
