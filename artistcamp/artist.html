<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sheikh — Ugandan Sheikhs</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/theme-ocean.css" />
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="shell-sidebar"></aside>
    <div class="main">
      <header class="topbar" id="shell-topbar"></header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="player" id="shell-player"></div>
  <div class="mini-player" id="shell-mini-player"></div>
  <nav class="mobile-nav" id="shell-mobilenav"></nav>
  <div id="shell-overlays"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
  <script>
    initAppPage("");
    const params = new URLSearchParams(location.search);
    const artist = ARTISTS.find(a => a.id === params.get("id")) || ARTISTS[0];
    const artistTracks = TRACKS.filter(t => t.artistId === artist.id).length ? TRACKS.filter(t => t.artistId === artist.id) : TRACKS.slice(0,8);
    const artistAlbums = ALBUMS.filter(a => a.artistId === artist.id).length ? ALBUMS.filter(a => a.artistId === artist.id) : ALBUMS.slice(0,3);
    const similar = ARTISTS.filter(a => a.genre === artist.genre && a.id !== artist.id).slice(0,6);
    // only this sheikh's own single lectures (artistAlbums above falls back to sample items, which must not count)
    const artistSingles = ALBUMS.filter(a => a.artistId === artist.id && a.type === "Single Lecture");

    document.getElementById("content").innerHTML = `
      <div class="entity-hero">
        <div class="entity-hero-bg" style="background-image:url('${artist.cover}');"></div>
        <div class="entity-hero-body">
          <img class="entity-hero-art round" src="${artist.img}" alt="${artist.name}" />
          <div class="entity-hero-info">
            <div class="kind">${artist.verified ? ICONS.check + ' Verified Sheikh' : 'Sheikh'}</div>
            <h1>${artist.name}</h1>
            <div class="entity-hero-meta">
              <span>${artist.listeners} monthly listeners</span>·<span>${artist.followers} followers</span>·<span>${artist.genre}</span>·<span>${artist.city}, ${artist.country}</span>
            </div>
          </div>
        </div>
        <div class="entity-hero-actions">
          <button class="btn btn-primary" onclick="toast('Playing ${artist.name}'.replace(/\\n/g,''))">${ICONS.play}<span>Play</span></button>
          <button class="btn btn-secondary" id="follow-btn">${ICONS.userPlus}<span>Follow</span></button>
          <button class="icon-btn btn-icon-only" onclick="toast('Link copied to clipboard')">${ICONS.share}</button>
          <button class="icon-btn btn-icon-only" onclick="toast('More options opened')">${ICONS.more}</button>
        </div>
      </div>

      <div class="tabs" id="artist-tabs">
        <button class="tab active" data-target="overview">Overview</button>
        <button class="tab" data-target="music">Lectures</button>
        <button class="tab" data-target="albums">Series</button>
        <button class="tab" data-target="singles">Single Lectures</button>
        <button class="tab" data-target="playlists">Collections</button>
        <button class="tab" data-target="about">About</button>
      </div>

      <div data-tabpanel="overview">
        <div class="section-header" style="margin-top:0;"><h2>Popular Lectures</h2></div>
        <table class="track-table"><thead><tr><th>#</th><th>Lecture</th><th>Series</th><th>Plays</th><th>Time</th><th></th></tr></thead>
          <tbody>${artistTracks.slice(0,5).map((t,i)=>trackRowHTML(t,i,{album:true})).join("")}</tbody></table>

        <div class="section-header"><h2>Discography</h2></div>
        <div class="grid grid-6">${artistAlbums.map(a=>cardHTML(a,"album")).join("")}</div>

        <div class="section-header"><h2>Similar Sheikhs</h2></div>
        <div class="rail">${similar.map(a=>cardHTML(a,"artist")).join("")}</div>
      </div>

      <div data-tabpanel="music" style="display:none;">
        <table class="track-table"><thead><tr><th>#</th><th>Lecture</th><th>Series</th><th>Plays</th><th>Time</th><th></th></tr></thead>
          <tbody>${artistTracks.map((t,i)=>trackRowHTML(t,i,{album:true})).join("")}</tbody></table>
      </div>

      <div data-tabpanel="albums" style="display:none;">
        <div class="grid grid-6">${artistAlbums.filter(a=>a.type==="Series").length?artistAlbums.filter(a=>a.type==="Series").map(a=>cardHTML(a,"album")).join(""):artistAlbums.map(a=>cardHTML(a,"album")).join("")}</div>
      </div>

      <div data-tabpanel="singles" style="display:none;">
        ${artistSingles.length
          ? `<div class="grid grid-6">${artistSingles.map(a=>cardHTML(a,"album")).join("")}</div>`
          : emptyStateHTML({ icon: "disc", title: "No single lectures yet", body: `${artist.name} hasn't published any single lectures on Ugandan Sheikhs.` })}
      </div>

      <div data-tabpanel="playlists" style="display:none;">
        <div class="grid grid-5">${PLAYLISTS.slice(0,5).map(p=>cardHTML(p,"playlist")).join("")}</div>
      </div>

      <div data-tabpanel="about" style="display:none;max-width:720px;">
        <h3 style="margin-bottom:14px;">About ${artist.name}</h3>
        <p class="text-secondary" style="margin-bottom:20px;">${artist.bio}</p>
        <div class="grid grid-2" style="max-width:480px;">
          <div><div class="eyebrow">Topic</div><div>${artist.genre}</div></div>
          <div><div class="eyebrow">Location</div><div>${artist.city}, ${artist.country}</div></div>
          <div><div class="eyebrow">Followers</div><div>${artist.followers}</div></div>
          <div><div class="eyebrow">Total Plays</div><div>${fmtCount(artistTracks.reduce((s,t)=>s+t.plays,0))}</div></div>
        </div>
      </div>
    `;
    wireTabs(document.getElementById("artist-tabs"));
    document.getElementById("follow-btn").addEventListener("click", function(){
      const following = this.classList.toggle("following");
      this.innerHTML = following ? `${ICONS.check}<span>Following</span>` : `${ICONS.userPlus}<span>Follow</span>`;
      toast(following ? `Now following ${artist.name}` : `Unfollowed ${artist.name}`, "success");
    });
  </script>
</body>
</html>
